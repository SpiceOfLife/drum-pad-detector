<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrumVision - Air Drumming System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --accent: #ff3d00;
    --accent2: #ffcc00;
    --text: #f0f0f0;
    --dim: #444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 4px;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(255,61,0,0.5);
  }

  .logo span { color: var(--accent2); }

  .status-row {
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 0.65rem;
    letter-spacing: 1px;
    color: var(--dim);
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--dim);
    transition: background 0.2s, box-shadow 0.2s;
  }
  .dot.active {
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
  }
  .dot.hit {
    background: var(--accent);
    box-shadow: 0 0 16px var(--accent);
  }

  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 220px;
    gap: 0;
    min-height: 0;
  }

  .camera-wrap {
    position: relative;
    overflow: hidden;
    background: #000;
  }

  video {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0.85;
    transform: scaleX(-1); /* 鏡像表示 */
  }

  canvas#overlay {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    transform: scaleX(-1); /* 鏡像表示に合わせる */
  }

  canvas#offscreen { display: none; }

  .hit-flash {
    position: absolute;
    inset: 0;
    background: var(--accent);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.05s;
  }
  .hit-flash.show { opacity: 0.25; }

  .no-cam {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: var(--dim);
    font-size: 0.75rem;
    letter-spacing: 2px;
    z-index: 10;
  }

  .start-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 18px 40px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 3px;
    cursor: pointer;
    clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
    transition: all 0.2s;
  }
  .start-btn:hover { background: #ff6d30; transform: scale(1.05); }

  .side {
    background: var(--surface);
    border-left: 1px solid #222;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .panel-section {
    padding: 16px;
    border-bottom: 1px solid #1a1a1a;
  }

  .panel-label {
    font-size: 0.55rem;
    letter-spacing: 3px;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .hit-counter {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 4rem;
    color: var(--accent2);
    line-height: 1;
  }

  .bpm-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    color: var(--text);
  }

  .pad-indicator {
    width: 100%;
    aspect-ratio: 1;
    background: #000;
    border: 1px solid #222;
  }

  .ctrl-row {
    margin-bottom: 12px;
  }

  .ctrl-row label {
    display: block;
    font-size: 0.55rem;
    color: var(--dim);
    margin-bottom: 4px;
  }

  input[type=range] {
    width: 100%;
    accent-color: var(--accent);
  }

  .val-display {
    font-size: 0.65rem;
    color: var(--accent2);
    text-align: right;
  }

  .hit-log {
    font-size: 0.6rem;
    color: var(--dim);
    max-height: 100px;
    overflow-y: auto;
  }

  footer {
    padding: 8px 20px;
    font-size: 0.55rem;
    color: #333;
    border-top: 1px solid #1a1a1a;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>

<header>
  <div class="logo">Drum<span>Vision</span></div>
  <div class="status-row">
    <div class="dot" id="camDot"></div><span id="camLabel">OFFLINE</span>
    &nbsp;&nbsp;
    <div class="dot" id="hitDot"></div><span>DETECTION</span>
  </div>
</header>

<div class="main">
  <div class="camera-wrap" id="camWrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <canvas id="offscreen"></canvas>
    <div class="hit-flash" id="hitFlash"></div>
    <div class="no-cam" id="noCam">
      <button class="start-btn" id="startBtn">ACTIVATE SYSTEM</button>
      <div id="errMsg" style="display:none; color:var(--accent); margin-top:10px;"></div>
    </div>
  </div>

  <div class="side">
    <div class="panel-section">
      <div class="panel-label">STRIKE COUNT</div>
      <div class="hit-counter" id="hitCount">0</div>
    </div>

    <div class="panel-section">
      <div class="panel-label">TEMPO (BPM)</div>
      <div class="bpm-val" id="bpmVal">---</div>
    </div>

    <div class="panel-section">
      <div class="panel-label">PAD MAP</div>
      <div class="pad-indicator">
        <svg viewBox="0 0 100 100" style="width:100%; height:100%;">
          <polygon points="30,5 70,5 95,30 95,70 70,95 30,95 5,70 5,30" fill="none" stroke="#333" stroke-width="1"/>
          <circle cx="50" cy="50" r="35" fill="none" stroke="#222" stroke-width="1" stroke-dasharray="2,2"/>
          <circle id="hitMarker" cx="50" cy="50" r="4" fill="none" transition="all 0.1s"/>
        </svg>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-label">SENSITIVITY</div>
      <div class="ctrl-row">
        <label>THRESHOLD</label>
        <input type="range" id="motionThresh" min="5" max="80" value="25">
        <div class="val-display" id="motionVal">25</div>
      </div>
      <div class="ctrl-row">
        <label>COOLDOWN (ms)</label>
        <input type="range" id="cooldownSlider" min="50" max="500" value="150" step="10">
        <div class="val-display" id="cooldownVal">150ms</div>
      </div>
    </div>

    <div class="panel-section" style="flex:1">
      <div class="panel-label">LIVE LOG</div>
      <div id="hitLog" class="hit-log"></div>
    </div>
  </div>
</div>

<footer>
  <span>ENGINE: VISION_CORE v1.0</span>
  <span id="fpsDisplay">-- FPS</span>
</footer>

<script>
// --- State ---
let videoEl, overlayCanvas, offCanvas, ctx, offCtx;
let prevFrame = null;
let hitCount = 0;
let lastHitTime = 0;
let hitTimes = [];
let audioCtx = null;
let padRect = null;
let motionThreshold = 25;
let cooldownMs = 150;

// --- Audio System ---
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playDrumSound(zone) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  // 周波数設定
  const freqs = { center: 65, mid: 110, rim: 280 };
  const baseFreq = freqs[zone] || 100;

  // 1. ボディサウンド（低域）
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(baseFreq * 1.8, now);
  osc.frequency.exponentialRampToValueAtTime(baseFreq, now + 0.1);
  gain.gain.setValueAtTime(0.8, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.3);

  // 2. インパクトサウンド（高域）
  const snap = audioCtx.createOscillator();
  const snapGain = audioCtx.createGain();
  snap.type = 'triangle';
  snap.frequency.setValueAtTime(1200, now);
  snapGain.gain.setValueAtTime(0.3, now);
  snapGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
  snap.connect(snapGain);
  snapGain.connect(audioCtx.destination);
  snap.start(now);
  snap.stop(now + 0.05);
}

// --- Vision System ---
async function startSystem() {
  initAudio(); // 音声の初期化

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: 'user', width: 640, height: 480 } 
    });
    videoEl.srcObject = stream;
    
    videoEl.onloadedmetadata = () => {
      document.getElementById('noCam').style.display = 'none';
      document.getElementById('camDot').classList.add('active');
      document.getElementById('camLabel').textContent = 'ACTIVE';
      resize();
      requestAnimationFrame(processFrame);
    };
  } catch (err) {
    document.getElementById('errMsg').textContent = "CAMERA ERROR: " + err.message;
    document.getElementById('errMsg').style.display = 'block';
  }
}

function resize() {
  overlayCanvas.width = videoEl.clientWidth;
  overlayCanvas.height = videoEl.clientHeight;
  offCanvas.width = 160; // 処理軽量化のため低解像度で解析
  offCanvas.height = 120;
}

function processFrame(ts) {
  if (videoEl.readyState >= 2) {
    offCtx.drawImage(videoEl, 0, 0, offCanvas.width, offCanvas.height);
    const currentFrame = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);

    if (prevFrame) {
      const motion = detectMotion(currentFrame, prevFrame);
      if (motion && (ts - lastHitTime) > cooldownMs) {
        handleHit(motion, ts);
        lastHitTime = ts;
      }
    }
    prevFrame = currentFrame;
    drawOverlay();
  }
  requestAnimationFrame(processFrame);
}

function detectMotion(curr, prev) {
  const d1 = curr.data;
  const d2 = prev.data;
  let maxDiff = 0;
  let mx = 0, my = 0, count = 0;

  // 中央エリアを中心に差分をチェック
  for (let i = 0; i < d1.length; i += 4) {
    const diff = Math.abs(d1[i] - d2[i]);
    if (diff > motionThreshold * 2) {
      const x = (i / 4) % offCanvas.width;
      const y = Math.floor((i / 4) / offCanvas.width);
      mx += x; my += y; count++;
    }
  }

  if (count > 30) {
    return { x: (mx / count) / offCanvas.width, y: (my / count) / offCanvas.height };
  }
  return null;
}

function handleHit(pos, ts) {
  hitCount++;
  document.getElementById('hitCount').textContent = hitCount;

  // ゾーン判定 (中心からの距離)
  const dx = pos.x - 0.5;
  const dy = pos.y - 0.5;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const zone = dist < 0.15 ? 'center' : dist < 0.35 ? 'mid' : 'rim';

  // 演出
  playDrumSound(zone);
  
  const flash = document.getElementById('hitFlash');
  flash.classList.add('show');
  setTimeout(() => flash.classList.remove('show'), 50);

  const marker = document.getElementById('hitMarker');
  marker.setAttribute('cx', pos.x * 100);
  marker.setAttribute('cy', pos.y * 100);
  marker.setAttribute('fill', zone === 'center' ? '#ff3d00' : '#ffcc00');
  setTimeout(() => marker.setAttribute('fill', 'none'), 200);

  // BPM計算
  hitTimes.push(ts);
  if (hitTimes.length > 10) hitTimes.shift();
  if (hitTimes.length > 2) {
    const avg = (hitTimes[hitTimes.length-1] - hitTimes[0]) / (hitTimes.length - 1);
    document.getElementById('bpmVal').textContent = Math.round(60000 / avg);
  }
}

function drawOverlay() {
  ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  ctx.strokeStyle = 'rgba(255, 61, 0, 0.5)';
  ctx.lineWidth = 2;
  ctx.strokeRect(overlayCanvas.width*0.2, overlayCanvas.height*0.2, overlayCanvas.width*0.6, overlayCanvas.height*0.6);
}

// --- Init ---
window.onload = () => {
  videoEl = document.getElementById('video');
  overlayCanvas = document.getElementById('overlay');
  offCanvas = document.getElementById('offscreen');
  ctx = overlayCanvas.getContext('2d');
  offCtx = offCanvas.getContext('2d');

  document.getElementById('startBtn').onclick = startSystem;
  
  document.getElementById('motionThresh').oninput = (e) => {
    motionThreshold = e.target.value;
    document.getElementById('motionVal').textContent = motionThreshold;
  };
  document.getElementById('cooldownSlider').oninput = (e) => {
    cooldownMs = parseInt(e.target.value);
    document.getElementById('cooldownVal').textContent = cooldownMs + 'ms';
  };
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DrumVision Pro - Octagon Lock (Fixed)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #000;
    --surface: rgba(25, 25, 25, 0.98);
    --accent: #00ff88;
    --searching: #ff3d00;
    --text: #f0f0f0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; height: 100dvh; overflow: hidden; touch-action: none; }

  /* 1. カメラ反転修正済みのビューポート */
  .main-viewport { position: relative; width: 100vw; height: 100vh; z-index: 1; }
  video, canvas#overlay {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 2;
    /* scaleX(-1) を完全に削除 */
  }

  /* 2. ドロワーの最前面保証 */
  .side-drawer {
    position: fixed;
    top: 0;
    right: 0;
    width: 300px;
    height: 100%;
    background: var(--surface);
    backdrop-filter: blur(15px);
    border-left: 1px solid rgba(255,255,255,0.1);
    z-index: 999999; /* 確実に最前面 */
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
    padding: 30px 20px;
    box-shadow: -10px 0 30px rgba(0,0,0,0.8);
  }
  .side-drawer.open { transform: translateX(0); }

  .drawer-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 50px;
    height: 50px;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    cursor: pointer;
    z-index: 1000000;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }

  .logo-mini { font-family: 'Bebas Neue'; font-size: 1.8rem; color: var(--accent); margin-bottom: 20px; }
  .hit-counter { font-family: 'Bebas Neue'; font-size: 6rem; color: var(--accent); text-align: center; margin: 10px 0; line-height: 1;}
  .panel-label { font-size: 0.65rem; color: #888; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px;}
  
  select, input[type=range] { width: 100%; background: #222; color: #fff; border: 1px solid #444; padding: 12px; font-family: inherit; margin-bottom: 20px;}

  .status-tag { display: inline-block; padding: 4px 10px; font-size: 0.65rem; border-radius: 3px; font-weight: bold; }
  .status-tag.active { color: var(--accent); border: 1px solid var(--accent); }
  .status-tag.error { color: var(--searching); border: 1px solid var(--searching); }

  #targetAlert {
    position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
    border: 2px solid var(--accent); color: var(--accent); padding: 15px 40px; 
    font-weight: bold; font-size: 1.5rem; z-index: 100; display: none; background: rgba(0,0,0,0.8);
  }

  .hit-flash { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 50; }
  .hit-flash.show { opacity: 0.3; }

  .no-cam { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000000; background: #000; }
  .start-btn { background: var(--accent); border: none; padding: 20px 50px; font-family: 'Bebas Neue'; font-size: 2rem; cursor: pointer; border-radius: 5px;}
</style>
</head>
<body>

<div class="main-viewport" id="viewport">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="targetAlert">OCTAGON LOCKED</div>
  <div class="hit-flash" id="hitFlash"></div>

  <div class="drawer-toggle" id="drawerBtn" title="Settings">⚙️</div>

  <aside class="side-drawer" id="drawer">
    <div class="logo-mini">DRUMVISION PRO</div>
    <div class="status-tag" id="detectStatus">OFFLINE</div>
    
    <div class="panel-label" style="margin-top:20px;">CAMERA SELECT</div>
    <select id="cameraSelect"></select>

    <div class="panel-label">STRIKE COUNT</div>
    <div class="hit-counter" id="hitCount">0</div>

    <div class="panel-label">HIT SENSITIVITY</div>
    <input type="range" id="motionThresh" min="10" max="100" value="45">
    <div style="text-align: right; color:var(--accent); font-size:0.8rem;" id="motionVal">45</div>

    <div style="margin-top:auto; font-size:0.6rem; color:#666; line-height: 1.4;">
      ● 8角形のグレーパッドのみ認識<br>
      ● スワイプまたは⚙️で設定表示<br>
      ● 要: snare.mp3
    </div>
  </aside>

  <div class="no-cam" id="noCam">
    <button class="start-btn" id="startBtn">START SYSTEM</button>
  </div>
</div>

<script>
// --- State ---
let videoEl, overlayCanvas, ctx, offCanvas, offCtx;
let snareBuffer, audioCtx, currentStream;
let padRect = null, isPadLocked = false, padDetectedFrames = 0;
let prevFrame, motionHistory = [0, 0, 0], hitCount = 0, lastHitTime = 0, motionThreshold = 45;

const drawer = document.getElementById('drawer');
const drawerBtn = document.getElementById('drawerBtn');

// Drawer Toggle
drawerBtn.onclick = (e) => { e.stopPropagation(); drawer.classList.toggle('open'); };

// Swipe Logic
let touchStartX = 0;
window.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX, {passive: true});
window.addEventListener('touchend', e => {
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (diff > 80 && touchStartX > window.innerWidth * 0.7) drawer.classList.add('open');
  if (diff < -80 && drawer.classList.contains('open')) drawer.classList.remove('open');
}, {passive: true});

// --- Audio ---
async function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  try {
    const res = await fetch('snare.mp3');
    const data = await res.arrayBuffer();
    snareBuffer = await audioCtx.decodeAudioData(data);
  } catch(e) { console.warn("snare.mp3が見つかりません。"); }
}

function playSnare() {
  if (!snareBuffer || !audioCtx || !isPadLocked) return;
  const s = audioCtx.createBufferSource();
  s.buffer = snareBuffer; s.connect(audioCtx.destination); s.start(0);
}

// --- Camera ---
async function changeCamera(id) {
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  const c = { video: { deviceId: id ? { exact: id } : undefined, width: 1280, height: 720 } };
  try {
    currentStream = await navigator.mediaDevices.getUserMedia(c);
    videoEl.srcObject = currentStream;
    
    const devices = await navigator.mediaDevices.enumerateDevices();
    const select = document.getElementById('cameraSelect');
    select.innerHTML = '';
    devices.filter(d => d.kind === 'videoinput').forEach(d => {
      const o = document.createElement('option'); o.value = d.deviceId; o.text = d.label || 'Camera';
      if(d.deviceId === id) o.selected = true;
      select.appendChild(o);
    });

    videoEl.onloadedmetadata = () => {
      overlayCanvas.width = videoEl.clientWidth;
      overlayCanvas.height = videoEl.clientHeight;
      ctx = overlayCanvas.getContext('2d');
      requestAnimationFrame(loop);
    };
  } catch(e) { console.error("Camera Error"); }
}

// --- パッド認識ロジック (手認識は完全に廃止) ---
function findOctagonPad(imageData) {
  const { data, width, height } = imageData;
  let minX = width, minY = height, maxX = 0, maxY = 0, count = 0;

  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2];
    const br = (r + g + b) / 3;
    const sat = Math.max(r, g, b) - Math.min(r, g, b);
    
    // 写真のような「グレーの8角形」をターゲットにした厳格な色判定
    if (br > 25 && br < 120 && sat < 15) {
      const x = (i/4)%width, y = Math.floor((i/4)/width);
      if(x < minX) minX = x; if(x > maxX) maxX = x;
      if(y < minY) minY = y; if(y > maxY) maxY = y;
      count++;
    }
  }

  // 面積がある程度大きく、極端に細長くない場合にパッドとみなす
  if (count > 300 && (maxX - minX) > width * 0.1) {
    const target = { x: minX/width, y: minY/height, w: (maxX-minX)/width, h: (maxY-minY)/height };
    if (!padRect) padRect = target;
    else {
      const lerp = 0.2;
      padRect.x += (target.x - padRect.x) * lerp; padRect.y += (target.y - padRect.y) * lerp;
      padRect.w += (target.w - padRect.w) * lerp; padRect.h += (target.h - padRect.h) * lerp;
    }
    return true; 
  }
  return false;
}

function loop(ts) {
  if (videoEl.readyState >= 2) {
    if (!offCanvas) { offCanvas = document.createElement('canvas'); offCanvas.width = 160; offCanvas.height = 120; offCtx = offCanvas.getContext('2d'); }
    offCtx.drawImage(videoEl, 0, 0, offCanvas.width, offCanvas.height);
    const frame = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);

    const found = findOctagonPad(frame);
    if (found) {
      padDetectedFrames++;
      if (padDetectedFrames > 30 && !isPadLocked) { isPadLocked = true; showAlert(); }
    } else {
      padDetectedFrames = 0; isPadLocked = false;
    }

    const status = document.getElementById('detectStatus');
    status.textContent = isPadLocked ? "LOCKED" : (found ? "SCANNING" : "SEARCHING");
    status.className = "status-tag " + (isPadLocked ? "active" : "error");

    if (prevFrame && isPadLocked) {
      const motion = analyzeMotion(frame, prevFrame);
      motionHistory.push(motion); motionHistory.shift();
      if (motionHistory[1] > motionThreshold && motionHistory[1] > motionHistory[2] && motionHistory[1] > motionHistory[0]) {
        if (ts - lastHitTime > 110) {
          hitCount++; document.getElementById('hitCount').textContent = hitCount;
          playSnare();
          const f = document.getElementById('hitFlash'); f.classList.add('show'); setTimeout(() => f.classList.remove('show'), 40);
          lastHitTime = ts;
        }
      }
    }
    prevFrame = frame;
    drawOverlay();
  }
  requestAnimationFrame(loop);
}

function analyzeMotion(curr, prev) {
  const d1 = curr.data, d2 = prev.data;
  const w = offCanvas.width, h = offCanvas.height;
  const x1 = Math.floor(padRect.x * w), y1 = Math.floor(padRect.y * h);
  const x2 = Math.floor((padRect.x + padRect.w) * w), y2 = Math.floor((padRect.y + padRect.h) * h);
  let diffSum = 0, pixels = 0;
  for (let y = y1; y < y2; y += 2) {
    for (let x = x1; x < x2; x += 2) {
      const i = (y * w + x) * 4;
      if (i < 0 || i >= d1.length) continue;
      const d = Math.abs(d1[i] - d2[i]);
      if (d > 35) diffSum += d;
      pixels++;
    }
  }
  return pixels > 0 ? (diffSum / pixels) * 12 : 0;
}

function drawOverlay() {
  ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  if (padRect) {
    if (isPadLocked) {
      ctx.fillStyle = 'rgba(0, 255, 136, 0.15)';
      ctx.fillRect(padRect.x * overlayCanvas.width, padRect.y * overlayCanvas.height, padRect.w * overlayCanvas.width, padRect.h * overlayCanvas.height);
    }
    ctx.strokeStyle = isPadLocked ? '#00ff88' : '#ff3d00'; 
    ctx.lineWidth = isPadLocked ? 5 : 2;
    ctx.strokeRect(padRect.x * overlayCanvas.width, padRect.y * overlayCanvas.height, padRect.w * overlayCanvas.width, padRect.h * overlayCanvas.height);
  }
}

function showAlert() { const a = document.getElementById('targetAlert'); a.style.display = 'block'; setTimeout(()=>a.style.display='none', 1500); }

window.onload = () => {
  videoEl = document.getElementById('video'); 
  overlayCanvas = document.getElementById('overlay');
  document.getElementById('startBtn').onclick = async () => { 
    await initAudio(); 
    document.getElementById('noCam').style.display = 'none'; 
    await changeCamera(); 
  };
  document.getElementById('cameraSelect').onchange = e => changeCamera(e.target.value);
  document.getElementById('motionThresh').oninput = e => { 
    motionThreshold = parseInt(e.target.value); 
    document.getElementById('motionVal').textContent = e.target.value; 
  };
  window.onresize = () => {
    if(videoEl.readyState >= 2) {
      overlayCanvas.width = videoEl.clientWidth;
      overlayCanvas.height = videoEl.clientHeight;
      ctx = overlayCanvas.getContext('2d');
    }
  };
};
</script>
</body>
</html>

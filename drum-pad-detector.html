<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrumVision - Area Selector</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --accent: #ff3d00;
    --accent2: #ffcc00;
    --text: #f0f0f0;
    --dim: #444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 4px;
    color: var(--accent);
  }

  .status-row {
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 0.65rem;
    color: var(--dim);
  }

  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 220px;
    min-height: 0;
  }

  .camera-wrap {
    position: relative;
    overflow: hidden;
    background: #000;
    cursor: crosshair;
    user-select: none;
  }

  video {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0.8;
  }

  canvas#overlay {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    z-index: 5;
  }

  .hit-flash {
    position: absolute;
    inset: 0;
    background: var(--accent);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.05s;
    z-index: 6;
  }
  .hit-flash.show { opacity: 0.2; }

  .no-cam {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    background: rgba(0,0,0,0.8);
  }

  .start-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 18px 40px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    cursor: pointer;
    clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
  }

  .side {
    background: var(--surface);
    border-left: 1px solid #222;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .panel-section {
    padding: 16px;
    border-bottom: 1px solid #1a1a1a;
  }

  .panel-label {
    font-size: 0.55rem;
    letter-spacing: 2px;
    color: var(--dim);
    margin-bottom: 8px;
  }

  .hit-counter {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 4rem;
    color: var(--accent2);
    line-height: 1;
  }

  select, button.sub-btn {
    width: 100%;
    background: #222;
    color: var(--text);
    border: 1px solid #444;
    padding: 8px;
    font-size: 0.7rem;
    margin-top: 5px;
  }

  .guide-msg {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 0.7rem;
    color: var(--accent2);
    z-index: 7;
    pointer-events: none;
  }

  input[type=range] { width: 100%; accent-color: var(--accent); }
  .val-display { font-size: 0.65rem; color: var(--accent2); text-align: right; }

  footer { padding: 8px 20px; font-size: 0.55rem; color: #333; border-top: 1px solid #1a1a1a; }
</style>
</head>
<body>

<header>
  <div class="logo">Drum<span>Vision</span></div>
  <div class="status-row">
    <div id="camLabel">OFFLINE</div>
  </div>
</header>

<div class="main">
  <div class="camera-wrap" id="camWrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="hit-flash" id="hitFlash"></div>
    <div class="guide-msg" id="guideMsg">ドラッグして判定エリアを選択してください</div>
    <div class="no-cam" id="noCam">
      <button class="start-btn" id="startBtn">START SYSTEM</button>
    </div>
  </div>

  <div class="side">
    <div class="panel-section">
      <div class="panel-label">CAMERA</div>
      <select id="cameraSelect"></select>
    </div>

    <div class="panel-section">
      <div class="panel-label">STRIKES</div>
      <div class="hit-counter" id="hitCount">0</div>
    </div>

    <div class="panel-section">
      <div class="panel-label">THRESHOLD</div>
      <input type="range" id="motionThresh" min="5" max="80" value="25">
      <div class="val-display" id="motionVal">25</div>
    </div>

    <div class="panel-section">
      <button class="sub-btn" id="resetAreaBtn">AREA RESET</button>
    </div>
  </div>
</div>

<footer>AREA SELECTOR ENABLED</footer>

<script>
let videoEl, overlayCanvas, ctx;
let offCanvas, offCtx;
let currentStream = null;
let prevFrame = null;
let hitCount = 0;
let lastHitTime = 0;
let audioCtx = null;
let motionThreshold = 25;

// エリア選択用
let selection = { x: 0.3, y: 0.3, w: 0.4, h: 0.4 }; // 正規化座標 (0~1)
let isDragging = false;
let startPos = { x: 0, y: 0 };

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.setValueAtTime(70, now);
  osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.2);
  gain.gain.setValueAtTime(0.5, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(now + 0.2);
}

async function getCameras() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  const select = document.getElementById('cameraSelect');
  select.innerHTML = '';
  devices.filter(d => d.kind === 'videoinput').forEach(d => {
    const opt = document.createElement('option');
    opt.value = d.deviceId;
    opt.text = d.label || 'Camera';
    select.appendChild(opt);
  });
}

async function startCamera(id = null) {
  initAudio();
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  
  const constraints = { 
    video: id ? { deviceId: id } : { facingMode: 'user' },
    width: 640, height: 480 
  };
  
  currentStream = await navigator.mediaDevices.getUserMedia(constraints);
  videoEl.srcObject = currentStream;
  document.getElementById('noCam').style.display = 'none';
  await getCameras();
  requestAnimationFrame(loop);
}

function loop(ts) {
  if (videoEl.readyState >= 2) {
    if (!offCanvas) {
      offCanvas = document.createElement('canvas');
      offCanvas.width = 160; offCanvas.height = 120;
      offCtx = offCanvas.getContext('2d');
    }
    
    offCtx.drawImage(videoEl, 0, 0, offCanvas.width, offCanvas.height);
    const curr = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);

    if (prevFrame) {
      const motion = checkMotion(curr, prevFrame);
      if (motion > motionThreshold && (ts - lastHitTime) > 150) {
        hitCount++;
        document.getElementById('hitCount').textContent = hitCount;
        playSound();
        const flash = document.getElementById('hitFlash');
        flash.classList.add('show');
        setTimeout(() => flash.classList.remove('show'), 50);
        lastHitTime = ts;
      }
    }
    prevFrame = curr;
    drawOverlay();
  }
  requestAnimationFrame(loop);
}

function checkMotion(curr, prev) {
  const d1 = curr.data;
  const d2 = prev.data;
  let diffCount = 0;

  // 選択範囲をオフスキャン用の座標に変換
  const x1 = Math.floor(selection.x * offCanvas.width);
  const y1 = Math.floor(selection.y * offCanvas.height);
  const x2 = Math.floor((selection.x + selection.w) * offCanvas.width);
  const y2 = Math.floor((selection.y + selection.h) * offCanvas.height);

  for (let y = y1; y < y2; y++) {
    for (let x = x1; x < x2; x++) {
      const i = (y * offCanvas.width + x) * 4;
      if (Math.abs(d1[i] - d2[i]) > 40) diffCount++;
    }
  }
  return (diffCount / ((x2-x1)*(y2-y1))) * 1000;
}

function drawOverlay() {
  ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  
  // エリアの描画
  ctx.strokeStyle = isDragging ? '#ffcc00' : '#ff3d00';
  ctx.lineWidth = 3;
  ctx.strokeRect(
    selection.x * overlayCanvas.width,
    selection.y * overlayCanvas.height,
    selection.w * overlayCanvas.width,
    selection.h * overlayCanvas.height
  );
  
  // 角の装飾
  ctx.fillStyle = '#ff3d00';
  ctx.fillRect(selection.x * overlayCanvas.width - 5, selection.y * overlayCanvas.height - 5, 10, 10);
}

// マウスイベント (座標指定)
function handleStart(e) {
  const rect = overlayCanvas.getBoundingClientRect();
  const x = (e.clientX || e.touches[0].clientX) - rect.left;
  const y = (e.clientY || e.touches[0].clientY) - rect.top;
  isDragging = true;
  startPos = { x: x / rect.width, y: y / rect.height };
  selection = { x: startPos.x, y: startPos.y, w: 0.01, h: 0.01 };
}

function handleMove(e) {
  if (!isDragging) return;
  const rect = overlayCanvas.getBoundingClientRect();
  const x = ((e.clientX || e.touches[0].clientX) - rect.left) / rect.width;
  const y = ((e.clientY || e.touches[0].clientY) - rect.top) / rect.height;
  
  selection.x = Math.min(startPos.x, x);
  selection.y = Math.min(startPos.y, y);
  selection.w = Math.abs(x - startPos.x);
  selection.h = Math.abs(y - startPos.y);
}

function handleEnd() {
  isDragging = false;
  if (selection.w < 0.05) selection = { x: 0.3, y: 0.3, w: 0.4, h: 0.4 }; // 小さすぎたらリセット
}

window.onload = () => {
  videoEl = document.getElementById('video');
  overlayCanvas = document.getElementById('overlay');
  ctx = overlayCanvas.getContext('2d');

  document.getElementById('startBtn').onclick = () => startCamera();
  document.getElementById('cameraSelect').onchange = (e) => startCamera(e.target.value);
  document.getElementById('motionThresh').oninput = (e) => {
    motionThreshold = e.target.value;
    document.getElementById('motionVal').textContent = motionThreshold;
  };
  document.getElementById('resetAreaBtn').onclick = () => {
    selection = { x: 0.3, y: 0.3, w: 0.4, h: 0.4 };
  };

  // イベント登録
  overlayCanvas.addEventListener('mousedown', handleStart);
  window.addEventListener('mousemove', handleMove);
  window.addEventListener('mouseup', handleEnd);
  overlayCanvas.addEventListener('touchstart', handleStart);
  window.addEventListener('touchmove', handleMove);
  window.addEventListener('touchend', handleEnd);

  window.onresize = () => {
    overlayCanvas.width = videoEl.clientWidth;
    overlayCanvas.height = videoEl.clientHeight;
  };
};
</script>
</body>
</html>

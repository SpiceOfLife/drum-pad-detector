<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrumVision Pro - Auto Detect</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --accent: #00ff88;
    --text: #f0f0f0;
    --dim: #444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid #222;
  }

  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--accent); letter-spacing: 4px; }

  .main { flex: 1; display: grid; grid-template-columns: 1fr 240px; min-height: 0; }

  .camera-wrap {
    position: relative;
    overflow: hidden;
    background: #000;
  }

  video, canvas#overlay {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1); /* 鏡像表示 */
  }

  .hit-flash {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.05s;
    z-index: 10;
  }
  .hit-flash.show { opacity: 0.2; }

  .no-cam {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    background: rgba(0,0,0,0.8);
  }

  .start-btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 20px 40px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    cursor: pointer;
    border-radius: 4px;
  }

  .side { background: var(--surface); border-left: 1px solid #222; padding: 20px; }
  .panel-label { font-size: 0.6rem; color: var(--dim); margin-bottom: 10px; letter-spacing: 2px; }
  .hit-counter { font-family: 'Bebas Neue', sans-serif; font-size: 5rem; color: var(--accent); line-height: 1; margin-bottom: 20px; }
  
  .status-tag {
    display: inline-block;
    padding: 4px 8px;
    font-size: 0.6rem;
    background: #222;
    border-radius: 3px;
    color: #888;
  }
  .status-tag.active { color: var(--accent); border: 1px solid var(--accent); }

  .ctrl-group { margin-top: 30px; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 10px 0; }
  
  footer { padding: 10px 20px; font-size: 0.6rem; color: #444; border-top: 1px solid #1a1a1a; }
</style>
</head>
<body>

<header>
  <div class="logo">DRUM<span>VISION</span> PRO</div>
  <div class="status-tag" id="detectStatus">PAD NOT FOUND</div>
</header>

<div class="main">
  <div class="camera-wrap" id="camWrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="hit-flash" id="hitFlash"></div>
    <div class="no-cam" id="noCam">
      <button class="start-btn" id="startBtn">START DETECTOR</button>
      <p style="margin-top:15px; font-size:0.7rem; color:#666;">snare.mp3 を同じフォルダに用意してください</p>
    </div>
  </div>

  <div class="side">
    <div class="panel-label">AUTO DETECT HITS</div>
    <div class="hit-counter" id="hitCount">0</div>
    
    <div class="ctrl-group">
      <div class="panel-label">MOTION SENSITIVITY</div>
      <input type="range" id="motionThresh" min="10" max="100" value="40">
      <div style="font-size:0.7rem; color:var(--accent)" id="motionVal">40</div>
    </div>

    <div style="margin-top:40px; font-size:0.6rem; color:#555; line-height:1.6;">
      <p>【仕組み】</p>
      <p>1. 画像解析でグレーのパッドを自動認識</p>
      <p>2. 枠内の「動きのピーク」を検知して発音</p>
    </div>
  </div>
</div>

<footer>ALGORITHM: ADAPTIVE PEAK DETECTION v2.0</footer>

<script>
let videoEl, overlayCanvas, ctx;
let offCanvas, offCtx;
let snareBuffer = null, audioCtx = null;
let currentStream = null;

// 解析用
let padRect = null; // {x, y, w, h}
let prevFrame = null;
let motionHistory = [0, 0, 0];
let hitCount = 0;
let lastHitTime = 0;
let motionThreshold = 40;

// --- Audio ---
async function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  try {
    const res = await fetch('snare.mp3');
    const data = await res.arrayBuffer();
    snareBuffer = await audioCtx.decodeAudioData(data);
  } catch(e) {
    console.error("Audio Load Error:", e);
  }
}

function playSnare() {
  if (!snareBuffer || !audioCtx) return;
  const source = audioCtx.createBufferSource();
  source.buffer = snareBuffer;
  source.connect(audioCtx.destination);
  source.start(0);
}

// --- Vision: ドラムパッドの自動検出 ---
function findDrumPad(imageData) {
  const { data, width, height } = imageData;
  let minX = width, minY = height, maxX = 0, maxY = 0;
  let foundCount = 0;

  for (let y = 0; y < height; y += 4) {
    for (let x = 0; x < width; x += 4) {
      const i = (y * width + x) * 4;
      const r = data[i], g = data[i+1], b = data[i+2];
      
      // 写真のような「グレーのパッド」を抽出するフィルタ
      // 彩度が低く、明るさが一定範囲(40-120)のピクセルを検索
      const brightness = (r + g + b) / 3;
      const saturation = Math.max(r, g, b) - Math.min(r, g, b);

      if (brightness > 30 && brightness < 130 && saturation < 20) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
        foundCount++;
      }
    }
  }

  // ある程度の大きさの塊があればパッドとみなす
  if (foundCount > 150) {
    const targetRect = {
      x: minX / width,
      y: minY / height,
      w: (maxX - minX) / width,
      h: (maxY - minY) / height
    };
    
    // 急激な枠の変動を抑えるための簡易スムージング
    if (!padRect) {
      padRect = targetRect;
    } else {
      padRect.x += (targetRect.x - padRect.x) * 0.1;
      padRect.y += (targetRect.y - padRect.y) * 0.1;
      padRect.w += (targetRect.w - padRect.w) * 0.1;
      padRect.h += (targetRect.h - padRect.h) * 0.1;
    }
    return true;
  }
  return false;
}

// --- Vision: ヒット判定（ピーク検知） ---
function analyzeHit(curr, prev) {
  if (!padRect) return 0;

  const d1 = curr.data;
  const d2 = prev.data;
  const w = offCanvas.width;
  
  const x1 = Math.floor(padRect.x * w);
  const y1 = Math.floor(padRect.y * offCanvas.height);
  const x2 = Math.floor((padRect.x + padRect.w) * w);
  const y2 = Math.floor((padRect.y + padRect.h) * offCanvas.height);

  let diffSum = 0;
  let pixels = 0;

  for (let y = y1; y < y2; y += 2) {
    for (let x = x1; x < x2; x += 2) {
      const i = (y * w + x) * 4;
      const diff = Math.abs(d1[i] - d2[i]);
      if (diff > 30) diffSum += diff;
      pixels++;
    }
  }
  return pixels > 0 ? (diffSum / pixels) * 10 : 0;
}

function loop(ts) {
  if (videoEl.readyState >= 2) {
    if (!offCanvas) {
      offCanvas = document.createElement('canvas');
      offCanvas.width = 160; offCanvas.height = 120;
      offCtx = offCanvas.getContext('2d');
    }

    offCtx.drawImage(videoEl, 0, 0, offCanvas.width, offCanvas.height);
    const frame = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);

    // 1. パッドの自動位置検出
    const found = findDrumPad(frame);
    const statusTag = document.getElementById('detectStatus');
    if (found) {
      statusTag.textContent = "PAD TRACKING";
      statusTag.classList.add('active');
    } else {
      statusTag.textContent = "PAD NOT FOUND";
      statusTag.classList.remove('active');
    }

    // 2. 動きの解析とピーク検知
    if (prevFrame && found) {
      const motion = analyzeHit(frame, prevFrame);
      motionHistory.push(motion);
      motionHistory.shift();

      const currentMotion = motionHistory[2];
      const prevMotion = motionHistory[1];
      const olderMotion = motionHistory[0];

      // ピーク判定ロジック：前フレームが閾値を超え、かつ現在のフレームで減少に転じた時
      if (prevMotion > motionThreshold && prevMotion > currentMotion && prevMotion > olderMotion) {
        if (ts - lastHitTime > 120) { // クールダウン
          hitCount++;
          document.getElementById('hitCount').textContent = hitCount;
          playSnare();
          
          const flash = document.getElementById('hitFlash');
          flash.classList.add('show');
          setTimeout(() => flash.classList.remove('show'), 50);
          lastHitTime = ts;
        }
      }
    }
    prevFrame = frame;
    drawOverlay();
  }
  requestAnimationFrame(loop);
}

function drawOverlay() {
  ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  if (padRect) {
    // パッドの枠を描画
    ctx.strokeStyle = '#00ff88';
    ctx.lineWidth = 4;
    ctx.setLineDash([10, 5]);
    ctx.strokeRect(
      padRect.x * overlayCanvas.width,
      padRect.y * overlayCanvas.height,
      padRect.w * overlayCanvas.width,
      padRect.h * overlayCanvas.height
    );
    
    // ラベル
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 14px Space Mono';
    ctx.fillText("TARGET: PAD", padRect.x * overlayCanvas.width, padRect.y * overlayCanvas.height - 10);
  }
}

async function start() {
  await initAudio();
  currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
  videoEl.srcObject = currentStream;
  document.getElementById('noCam').style.display = 'none';
  
  overlayCanvas.width = videoEl.clientWidth;
  overlayCanvas.height = videoEl.clientHeight;
  ctx = overlayCanvas.getContext('2d');
  
  requestAnimationFrame(loop);
}

window.onload = () => {
  videoEl = document.getElementById('video');
  overlayCanvas = document.getElementById('overlay');
  
  document.getElementById('startBtn').onclick = start;
  document.getElementById('motionThresh').oninput = (e) => {
    motionThreshold = parseInt(e.target.value);
    document.getElementById('motionVal').textContent = motionThreshold;
  };
  
  window.onresize = () => {
    overlayCanvas.width = videoEl.clientWidth;
    overlayCanvas.height = videoEl.clientHeight;
  };
};
</script>
</body>
</html>

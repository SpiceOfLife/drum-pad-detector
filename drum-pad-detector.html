<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrumVision 3D - MediaPipe Powered</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap');
  :root { --bg: #000; --accent: #00ff88; --text: #f0f0f0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; overflow: hidden; }

  .viewport { position: relative; width: 100vw; height: 100vh; }
  video#input_video { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
  canvas#output_canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 5; }

  /* UI Layer */
  .ui-overlay {
    position: absolute; top: 20px; left: 20px; z-index: 10;
    background: rgba(0,0,0,0.7); padding: 20px; border: 1px solid var(--accent); border-radius: 8px;
  }
  .hit-counter { font-family: 'Bebas Neue'; font-size: 4rem; color: var(--accent); line-height: 1; }
  .status { font-size: 0.7rem; margin-top: 10px; color: #888; }
  
  .hit-flash { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 20; }
  .hit-flash.active { animation: flashAnim 0.1s; }
  @keyframes flashAnim { from { opacity: 0.3; } to { opacity: 0; } }

  .loading-screen {
    position: fixed; inset: 0; background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 100;
  }
  .start-btn {
    background: var(--accent); color: #000; border: none; padding: 15px 40px;
    font-family: 'Bebas Neue'; font-size: 1.5rem; cursor: pointer; display: none;
  }
</style>
</head>
<body>

<div class="viewport">
  <video id="input_video"></video>
  <canvas id="output_canvas"></canvas>
  <div class="hit-flash" id="hitFlash"></div>

  <div class="ui-overlay">
    <div style="font-size:0.6rem; letter-spacing:2px; color:#888;">STRIKE COUNT</div>
    <div class="hit-counter" id="hitCount">0</div>
    <div class="status" id="statusInfo">INITIALIZING AI...</div>
    <div id="zDepthInfo" style="font-size:0.6rem; color:#ffcc00; margin-top:5px;">Z-DEPTH: --</div>
  </div>

  <div class="loading-screen" id="loader">
    <div id="loadText" style="margin-bottom:20px;">AI MODELS LOADING...</div>
    <button class="start-btn" id="startBtn">START 3D SESSION</button>
  </div>
</div>

<script>
const videoElement = document.getElementById('input_video');
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d');
const hitCountEl = document.getElementById('hitCount');
const zDepthEl = document.getElementById('zDepthInfo');

let hitCount = 0;
let lastZ = 0;
let zVelocity = 0;
let snareBuffer, audioCtx;
let lastHitTime = 0;

// --- Audio ---
async function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  try {
    const res = await fetch('snare.mp3');
    const data = await res.arrayBuffer();
    snareBuffer = await audioCtx.decodeAudioData(data);
  } catch(e) { console.warn("snare.mp3 not found."); }
}

function playSnare() {
  if (!snareBuffer || !audioCtx) return;
  const s = audioCtx.createBufferSource();
  s.buffer = snareBuffer; s.connect(audioCtx.destination); s.start(0);
}

// --- MediaPipe Implementation ---
const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.7
});

hands.onResults(onResults);

function onResults(results) {
  // Canvas preparation
  canvasElement.width = videoElement.clientWidth;
  canvasElement.height = videoElement.clientHeight;
  canvasCtx.save();
  canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    document.getElementById('statusInfo').textContent = "HAND TRACKED (3D)";
    
    for (const landmarks of results.multiHandLandmarks) {
      // Draw skeleton
      drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00ff88', lineWidth: 2});
      drawLandmarks(canvasCtx, landmarks, {color: '#ffffff', lineWidth: 1, radius: 2});

      // 立体認識（Z軸解析）
      // 8番: 人差し指の指先 (Index Finger Tip)
      const indexTip = landmarks[8];
      const currentZ = indexTip.z; // 相対的な奥行き
      
      zVelocity = currentZ - lastZ;
      zDepthEl.textContent = `Z-DEPTH: ${currentZ.toFixed(3)} | VEL: ${zVelocity.toFixed(3)}`;

      // 【3Dヒット判定ロジック】
      // 1. Z軸方向へ急激な移動がある（奥に叩きつける動き）
      // 2. 速度が一定のしきい値を超えた
      // 3. 一定の奥行き（画面奥側）に達した
      const now = Date.now();
      if (zVelocity > 0.025 && currentZ > -0.05 && (now - lastHitTime > 150)) {
        triggerHit();
        lastHitTime = now;
      }
      lastZ = currentZ;
    }
  } else {
    document.getElementById('statusInfo').textContent = "SEARCHING FOR HAND...";
  }
  canvasCtx.restore();
}

function triggerHit() {
  hitCount++;
  hitCountEl.textContent = hitCount;
  playSnare();
  const flash = document.getElementById('hitFlash');
  flash.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 100);
}

// --- Lifecycle ---
const camera = new Camera(videoElement, {
  onFrame: async () => {
    await hands.send({image: videoElement});
  },
  width: 1280,
  height: 720
});

window.onload = async () => {
  document.getElementById('loadText').textContent = "AI READY. PREPARE AUDIO.";
  document.getElementById('startBtn').style.display = "block";
  
  document.getElementById('startBtn').onclick = async () => {
    await initAudio();
    document.getElementById('loader').style.display = "none";
    camera.start();
  };
};
</script>
</body>
</html>

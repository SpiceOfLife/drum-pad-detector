<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrumVision Pro - High Precision</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --accent: #00ff88;
    --alert: #ffcc00;
    --text: #f0f0f0;
    --dim: #444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid #222;
  }

  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--accent); letter-spacing: 4px; }

  .main { flex: 1; display: grid; grid-template-columns: 1fr 260px; min-height: 0; }

  .camera-wrap {
    position: relative;
    overflow: hidden;
    background: #000;
  }

  video, canvas#overlay {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }

  /* 認識アラートアニメーション */
  #targetAlert {
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 255, 136, 0.2);
    border: 2px solid var(--accent);
    color: var(--accent);
    padding: 10px 30px;
    font-weight: bold;
    font-size: 1.2rem;
    z-index: 100;
    pointer-events: none;
    display: none;
    animation: alertPop 0.5s ease-out;
  }

  @keyframes alertPop {
    0% { opacity: 0; transform: translate(-50%, -20%); }
    100% { opacity: 1; transform: translate(-50%, -50%); }
  }

  .hit-flash {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.05s;
    z-index: 10;
  }
  .hit-flash.show { opacity: 0.2; }

  .no-cam {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    background: rgba(0,0,0,0.8);
  }

  .start-btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 20px 40px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    cursor: pointer;
    border-radius: 4px;
  }

  .side { background: var(--surface); border-left: 1px solid #222; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
  .panel-label { font-size: 0.6rem; color: var(--dim); margin-bottom: 10px; letter-spacing: 2px; text-transform: uppercase; }
  .hit-counter { font-family: 'Bebas Neue', sans-serif; font-size: 5rem; color: var(--accent); line-height: 1; }
  
  select {
    width: 100%;
    background: #222;
    color: var(--text);
    border: 1px solid #444;
    padding: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
  }

  .status-tag {
    display: inline-block;
    padding: 4px 8px;
    font-size: 0.6rem;
    background: #222;
    border-radius: 3px;
    color: #888;
  }
  .status-tag.active { color: var(--accent); border: 1px solid var(--accent); }
  .status-tag.warning { color: var(--alert); border: 1px solid var(--alert); }

  footer { padding: 10px 20px; font-size: 0.6rem; color: #444; border-top: 1px solid #1a1a1a; display: flex; justify-content: space-between; }
</style>
</head>
<body>

<header>
  <div class="logo">DRUM<span>VISION</span> PRO</div>
  <div class="status-tag" id="detectStatus">OFFLINE</div>
</header>

<div class="main">
  <div class="camera-wrap" id="camWrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="targetAlert">TARGET LOCKED</div>
    <div class="hit-flash" id="hitFlash"></div>
    <div class="no-cam" id="noCam">
      <button class="start-btn" id="startBtn">ACTIVATE SYSTEM</button>
    </div>
  </div>

  <div class="side">
    <div class="panel-section">
      <div class="panel-label">CAMERA DEVICE</div>
      <select id="cameraSelect"></select>
    </div>

    <div class="panel-section">
      <div class="panel-label">STRIKE COUNT</div>
      <div class="hit-counter" id="hitCount">0</div>
    </div>
    
    <div class="ctrl-group">
      <div class="panel-label">HIT SENSITIVITY</div>
      <input type="range" id="motionThresh" min="10" max="100" value="40">
      <div style="font-size:0.7rem; color:var(--accent); text-align: right;" id="motionVal">40</div>
    </div>

    <div style="margin-top:auto; font-size:0.55rem; color:#555; line-height:1.6; border-top:1px solid #222; padding-top:15px;">
      <p>【システムの状態】</p>
      <p id="audioInfo" style="color:#ff3d00;">● AUDIO: snare.mp3 NOT LOADED</p>
      <p id="padInfo">● PAD: NOT RECOGNIZED</p>
    </div>
  </div>
</div>

<footer>
  <span>PRECISION_CORE v3.0</span>
  <span id="fpsDisplay">-- FPS</span>
</footer>

<script>
let videoEl, overlayCanvas, ctx;
let offCanvas, offCtx;
let snareBuffer = null, audioCtx = null;
let currentStream = null;

let padRect = null;
let padDetectedFrames = 0; // 連続検出フレーム数
let isPadLocked = false;   // 認識確定フラグ

let prevFrame = null;
let motionHistory = [0, 0, 0];
let hitCount = 0;
let lastHitTime = 0;
let motionThreshold = 40;

// --- Audio ---
async function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  try {
    const res = await fetch('snare.mp3');
    if (!res.ok) throw new Error();
    const data = await res.arrayBuffer();
    snareBuffer = await audioCtx.decodeAudioData(data);
    document.getElementById('audioInfo').textContent = "● AUDIO: snare.mp3 READY";
    document.getElementById('audioInfo').style.color = "#00ff88";
  } catch(e) {
    document.getElementById('audioInfo').textContent = "● AUDIO: snare.mp3 ERROR";
  }
}

function playSnare() {
  // パッドがロックされていない場合は絶対に鳴らさない
  if (!snareBuffer || !audioCtx || !isPadLocked) return;
  const source = audioCtx.createBufferSource();
  source.buffer = snareBuffer;
  source.connect(audioCtx.destination);
  source.start(0);
}

// --- Camera ---
async function changeCamera(deviceId) {
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  const constraints = { video: { deviceId: deviceId ? { exact: deviceId } : undefined, width: 640, height: 480 } };
  try {
    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
    videoEl.srcObject = currentStream;
    const devices = await navigator.mediaDevices.enumerateDevices();
    const select = document.getElementById('cameraSelect');
    select.innerHTML = '';
    devices.filter(d => d.kind === 'videoinput').forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.text = d.label || `Camera ${i + 1}`;
      if (d.deviceId === deviceId) opt.selected = true;
      select.appendChild(opt);
    });
    videoEl.onloadedmetadata = () => {
      overlayCanvas.width = videoEl.clientWidth;
      overlayCanvas.height = videoEl.clientHeight;
      ctx = overlayCanvas.getContext('2d');
      requestAnimationFrame(loop);
    };
  } catch (e) { alert("Camera Error"); }
}

// --- Logic ---
function findPad(imageData) {
  const { data, width, height } = imageData;
  let minX = width, minY = height, maxX = 0, maxY = 0, count = 0;

  // 精度調整：グレースケールのパッド検出条件を緩和しつつ密度をチェック
  for (let y = 0; y < height; y += 4) {
    for (let x = 0; x < width; x += 4) {
      const i = (y * width + x) * 4;
      const r = data[i], g = data[i+1], b = data[i+2];
      const brightness = (r + g + b) / 3;
      const sat = Math.max(r, g, b) - Math.min(r, g, b);
      
      // パッドのグレー範囲を少し広めに設定（照明変化に対応）
      if (brightness > 25 && brightness < 140 && sat < 25) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
        count++;
      }
    }
  }

  // 面積が小さすぎる場合は無視（ノイズ対策）
  if (count > 200 && (maxX - minX) > width * 0.1) {
    const target = { x: minX/width, y: minY/height, w: (maxX-minX)/width, h: (maxY-minY)/height };
    if (!padRect) padRect = target;
    else {
      const lerp = 0.2;
      padRect.x += (target.x - padRect.x) * lerp; padRect.y += (target.y - padRect.y) * lerp;
      padRect.w += (target.w - padRect.w) * lerp; padRect.h += (target.h - padRect.h) * lerp;
    }
    return true;
  }
  return false;
}

function loop(ts) {
  if (videoEl.readyState >= 2) {
    if (!offCanvas) {
      offCanvas = document.createElement('canvas');
      offCanvas.width = 160; offCanvas.height = 120;
      offCtx = offCanvas.getContext('2d');
    }
    offCtx.drawImage(videoEl, 0, 0, offCanvas.width, offCanvas.height);
    const frame = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);

    const found = findPad(frame);
    
    // ロック判定ロジック
    if (found) {
      padDetectedFrames++;
      if (padDetectedFrames > 15 && !isPadLocked) {
        // ロックオン成功
        isPadLocked = true;
        showAlert();
      }
    } else {
      padDetectedFrames = 0;
      isPadLocked = false;
      padRect = null;
    }

    // UI更新
    const status = document.getElementById('detectStatus');
    const padInfo = document.getElementById('padInfo');
    if (isPadLocked) {
      status.textContent = "LOCKED"; status.className = "status-tag active";
      padInfo.textContent = "● PAD: LOCKED"; padInfo.style.color = "#00ff88";
    } else if (found) {
      status.textContent = "SCANNING..."; status.className = "status-tag warning";
      padInfo.textContent = "● PAD: DETECTING..."; padInfo.style.color = "#ffcc00";
    } else {
      status.textContent = "SEARCHING"; status.className = "status-tag";
      padInfo.textContent = "● PAD: NOT FOUND"; padInfo.style.color = "#555";
    }

    // ヒット判定（ロックされている時のみ）
    if (prevFrame && isPadLocked) {
      const motion = analyzeMotion(frame, prevFrame);
      motionHistory.push(motion); motionHistory.shift();
      if (motionHistory[1] > motionThreshold && motionHistory[1] > motionHistory[2] && motionHistory[1] > motionHistory[0]) {
        if (ts - lastHitTime > 110) {
          hitCount++;
          document.getElementById('hitCount').textContent = hitCount;
          playSnare(); // ここで音が出る
          const flash = document.getElementById('hitFlash');
          flash.classList.add('show'); setTimeout(() => flash.classList.remove('show'), 40);
          lastHitTime = ts;
        }
      }
    }
    prevFrame = frame;
    drawOverlay();
  }
  requestAnimationFrame(loop);
}

function analyzeMotion(curr, prev) {
  const d1 = curr.data, d2 = prev.data;
  const w = offCanvas.width, h = offCanvas.height;
  const x1 = Math.floor(padRect.x * w), y1 = Math.floor(padRect.y * h);
  const x2 = Math.floor((padRect.x + padRect.w) * w), y2 = Math.floor((padRect.y + padRect.h) * h);
  let diffSum = 0, pixels = 0;
  for (let y = y1; y < y2; y += 2) {
    for (let x = x1; x < x2; x += 2) {
      const i = (y * w + x) * 4;
      const d = Math.abs(d1[i] - d2[i]);
      if (d > 35) diffSum += d;
      pixels++;
    }
  }
  return pixels > 0 ? (diffSum / pixels) * 10 : 0;
}

function drawOverlay() {
  ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  if (padRect) {
    ctx.strokeStyle = isPadLocked ? '#00ff88' : '#ffcc00'; 
    ctx.lineWidth = isPadLocked ? 4 : 2; 
    ctx.setLineDash(isPadLocked ? [] : [8, 4]);
    ctx.strokeRect(padRect.x * overlayCanvas.width, padRect.y * overlayCanvas.height, padRect.w * overlayCanvas.width, padRect.h * overlayCanvas.height);
    if (isPadLocked) {
      ctx.fillStyle = '#00ff88'; ctx.font = 'bold 12px Space Mono';
      ctx.fillText("PAD READY", padRect.x * overlayCanvas.width, padRect.y * overlayCanvas.height - 10);
    }
  }
}

function showAlert() {
  const alertEl = document.getElementById('targetAlert');
  alertEl.style.display = 'block';
  setTimeout(() => { alertEl.style.display = 'none'; }, 1500);
}

window.onload = () => {
  videoEl = document.getElementById('video');
  overlayCanvas = document.getElementById('overlay');
  document.getElementById('startBtn').onclick = async () => {
    await initAudio();
    document.getElementById('noCam').style.display = 'none';
    await changeCamera();
  };
  document.getElementById('cameraSelect').onchange = (e) => changeCamera(e.target.value);
  document.getElementById('motionThresh').oninput = (e) => {
    motionThreshold = parseInt(e.target.value);
    document.getElementById('motionVal').textContent = motionThreshold;
  };
};
</script>
</body>
</html>

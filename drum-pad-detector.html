<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrumVision Pro - Cam Selector</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --accent: #00ff88;
    --text: #f0f0f0;
    --dim: #444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid #222;
  }

  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--accent); letter-spacing: 4px; }

  .main { flex: 1; display: grid; grid-template-columns: 1fr 260px; min-height: 0; }

  .camera-wrap {
    position: relative;
    overflow: hidden;
    background: #000;
  }

  video, canvas#overlay {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }

  .hit-flash {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.05s;
    z-index: 10;
  }
  .hit-flash.show { opacity: 0.2; }

  .no-cam {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    background: rgba(0,0,0,0.8);
  }

  .start-btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 20px 40px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    cursor: pointer;
    border-radius: 4px;
  }

  .side { background: var(--surface); border-left: 1px solid #222; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
  .panel-label { font-size: 0.6rem; color: var(--dim); margin-bottom: 10px; letter-spacing: 2px; text-transform: uppercase; }
  .hit-counter { font-family: 'Bebas Neue', sans-serif; font-size: 5rem; color: var(--accent); line-height: 1; }
  
  select {
    width: 100%;
    background: #222;
    color: var(--text);
    border: 1px solid #444;
    padding: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    outline: none;
  }

  .ctrl-group { margin-top: 10px; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 10px 0; }
  
  .status-tag {
    display: inline-block;
    padding: 4px 8px;
    font-size: 0.6rem;
    background: #222;
    border-radius: 3px;
    color: #888;
  }
  .status-tag.active { color: var(--accent); border: 1px solid var(--accent); }

  footer { padding: 10px 20px; font-size: 0.6rem; color: #444; border-top: 1px solid #1a1a1a; display: flex; justify-content: space-between; }
</style>
</head>
<body>

<header>
  <div class="logo">DRUM<span>VISION</span> PRO</div>
  <div class="status-tag" id="detectStatus">SYSTEM STANDBY</div>
</header>

<div class="main">
  <div class="camera-wrap" id="camWrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="hit-flash" id="hitFlash"></div>
    <div class="no-cam" id="noCam">
      <button class="start-btn" id="startBtn">ACTIVATE CAMERA</button>
    </div>
  </div>

  <div class="side">
    <div class="panel-section">
      <div class="panel-label">CAMERA DEVICE</div>
      <select id="cameraSelect">
        <option value="">(Waiting for activation...)</option>
      </select>
    </div>

    <div class="panel-section">
      <div class="panel-label">STRIKE COUNT</div>
      <div class="hit-counter" id="hitCount">0</div>
    </div>
    
    <div class="ctrl-group">
      <div class="panel-label">SENSITIVITY (Peak Thresh)</div>
      <input type="range" id="motionThresh" min="10" max="100" value="40">
      <div style="font-size:0.7rem; color:var(--accent); text-align: right;" id="motionVal">40</div>
    </div>

    <div style="margin-top:auto; font-size:0.55rem; color:#555; line-height:1.6; border-top:1px solid #222; padding-top:15px;">
      <p>【使用方法】</p>
      <p>1. カメラを選択してパッドを映す</p>
      <p>2. 緑の枠がパッドを捉えたら準備完了</p>
      <p>3. スネア音は snare.mp3 が必要です</p>
    </div>
  </div>
</div>

<footer>
  <span>V-CORE: 2.1.0</span>
  <span id="fpsDisplay">-- FPS</span>
</footer>

<script>
// --- Variables ---
let videoEl, overlayCanvas, ctx;
let offCanvas, offCtx;
let snareBuffer = null, audioCtx = null;
let currentStream = null;
let padRect = null;
let prevFrame = null;
let motionHistory = [0, 0, 0];
let hitCount = 0;
let lastHitTime = 0;
let motionThreshold = 40;
let isLooping = false;

// --- Audio Init ---
async function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  try {
    const res = await fetch('snare.mp3');
    if (!res.ok) throw new Error("File not found");
    const data = await res.arrayBuffer();
    snareBuffer = await audioCtx.decodeAudioData(data);
  } catch(e) {
    console.warn("Snare sound failed to load. Ensure snare.mp3 is in the same folder.");
  }
}

function playSnare() {
  if (!snareBuffer || !audioCtx) return;
  const source = audioCtx.createBufferSource();
  source.buffer = snareBuffer;
  source.connect(audioCtx.destination);
  source.start(0);
}

// --- Camera Device Selection ---
async function updateCameraList() {
  const select = document.getElementById('cameraSelect');
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const videoDevices = devices.filter(d => d.kind === 'videoinput');
    
    select.innerHTML = '';
    videoDevices.forEach((device, i) => {
      const opt = document.createElement('option');
      opt.value = device.deviceId;
      opt.text = device.label || `Camera ${i + 1}`;
      select.appendChild(opt);
    });
  } catch (e) {
    console.error("Error listing cameras:", e);
  }
}

async function changeCamera(deviceId) {
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
  }

  const constraints = {
    video: { deviceId: deviceId ? { exact: deviceId } : undefined, width: 640, height: 480 }
  };

  try {
    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
    videoEl.srcObject = currentStream;
    
    // 初回起動時のみデバイスリストを更新（ラベル取得のため）
    await updateCameraList();
    // セレクトボックスの選択状態を維持
    if(deviceId) document.getElementById('cameraSelect').value = deviceId;

    videoEl.onloadedmetadata = () => {
      resizeOverlay();
      if (!isLooping) {
        isLooping = true;
        requestAnimationFrame(loop);
      }
    };
  } catch (e) {
    alert("Camera Access Denied: " + e.message);
  }
}

// --- Vision Logic ---
function findPad(imageData) {
  const { data, width, height } = imageData;
  let minX = width, minY = height, maxX = 0, maxY = 0, count = 0;

  for (let y = 0; y < height; y += 4) {
    for (let x = 0; x < width; x += 4) {
      const i = (y * width + x) * 4;
      const r = data[i], g = data[i+1], b = data[i+2];
      const brightness = (r + g + b) / 3;
      const sat = Math.max(r, g, b) - Math.min(r, g, b);
      
      // Gray pad detector
      if (brightness > 35 && brightness < 125 && sat < 18) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
        count++;
      }
    }
  }

  if (count > 150) {
    const target = { x: minX/width, y: minY/height, w: (maxX-minX)/width, h: (maxY-minY)/height };
    if (!padRect) padRect = target;
    else {
      const lerp = 0.15;
      padRect.x += (target.x - padRect.x) * lerp; padRect.y += (target.y - padRect.y) * lerp;
      padRect.w += (target.w - padRect.w) * lerp; padRect.h += (target.h - padRect.h) * lerp;
    }
    return true;
  }
  return false;
}

function analyzeMotion(curr, prev) {
  if (!padRect) return 0;
  const d1 = curr.data, d2 = prev.data;
  const w = offCanvas.width, h = offCanvas.height;
  const x1 = Math.floor(padRect.x * w), y1 = Math.floor(padRect.y * h);
  const x2 = Math.floor((padRect.x + padRect.w) * w), y2 = Math.floor((padRect.y + padRect.h) * h);

  let diffSum = 0, pixels = 0;
  for (let y = y1; y < y2; y += 2) {
    for (let x = x1; x < x2; x += 2) {
      const i = (y * w + x) * 4;
      const d = Math.abs(d1[i] - d2[i]);
      if (d > 35) diffSum += d;
      pixels++;
    }
  }
  return pixels > 0 ? (diffSum / pixels) * 10 : 0;
}

function loop(ts) {
  if (videoEl.readyState >= 2) {
    if (!offCanvas) {
      offCanvas = document.createElement('canvas');
      offCanvas.width = 160; offCanvas.height = 120;
      offCtx = offCanvas.getContext('2d');
    }
    offCtx.drawImage(videoEl, 0, 0, offCanvas.width, offCanvas.height);
    const frame = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);

    const found = findPad(frame);
    const status = document.getElementById('detectStatus');
    status.textContent = found ? "PAD TRACKING" : "SEARCHING FOR PAD...";
    status.className = "status-tag" + (found ? " active" : "");

    if (prevFrame && found) {
      const motion = analyzeMotion(frame, prevFrame);
      motionHistory.push(motion);
      motionHistory.shift();

      if (motionHistory[1] > motionThreshold && motionHistory[1] > motionHistory[2] && motionHistory[1] > motionHistory[0]) {
        if (ts - lastHitTime > 110) {
          hitCount++;
          document.getElementById('hitCount').textContent = hitCount;
          playSnare();
          const flash = document.getElementById('hitFlash');
          flash.classList.add('show'); setTimeout(() => flash.classList.remove('show'), 40);
          lastHitTime = ts;
        }
      }
    }
    prevFrame = frame;
    drawOverlay();
  }
  requestAnimationFrame(loop);
}

function drawOverlay() {
  ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  if (padRect) {
    ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 3; ctx.setLineDash([8, 4]);
    ctx.strokeRect(padRect.x * overlayCanvas.width, padRect.y * overlayCanvas.height, padRect.w * overlayCanvas.width, padRect.h * overlayCanvas.height);
    ctx.fillStyle = '#00ff88'; ctx.font = '12px Space Mono';
    ctx.fillText("LOCKED", padRect.x * overlayCanvas.width, padRect.y * overlayCanvas.height - 8);
  }
}

function resizeOverlay() {
  overlayCanvas.width = videoEl.clientWidth;
  overlayCanvas.height = videoEl.clientHeight;
  ctx = overlayCanvas.getContext('2d');
}

// --- Lifecycle ---
window.onload = () => {
  videoEl = document.getElementById('video');
  overlayCanvas = document.getElementById('overlay');
  const camSelect = document.getElementById('cameraSelect');

  document.getElementById('startBtn').onclick = async () => {
    await initAudio();
    document.getElementById('noCam').style.display = 'none';
    await changeCamera();
  };

  camSelect.onchange = (e) => {
    changeCamera(e.target.value);
  };

  document.getElementById('motionThresh').oninput = (e) => {
    motionThreshold = parseInt(e.target.value);
    document.getElementById('motionVal').textContent = motionThreshold;
  };

  window.onresize = resizeOverlay;
};
</script>
</body>
</html>

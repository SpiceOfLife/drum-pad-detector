<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrumVision - External Audio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --accent: #00e5ff; /* スネア用に色を変更 */
    --accent2: #f0f0f0;
    --text: #f0f0f0;
    --dim: #444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 4px;
    color: var(--accent);
  }

  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 220px;
    min-height: 0;
  }

  .camera-wrap {
    position: relative;
    overflow: hidden;
    background: #000;
    cursor: crosshair;
  }

  video {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0.8;
  }

  canvas#overlay {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    z-index: 5;
  }

  .hit-flash {
    position: absolute;
    inset: 0;
    background: var(--accent);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.05s;
    z-index: 6;
  }
  .hit-flash.show { opacity: 0.3; }

  .no-cam {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    background: rgba(0,0,0,0.9);
  }

  .start-btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 18px 40px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    font-weight: bold;
    cursor: pointer;
    clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
  }

  .side {
    background: var(--surface);
    border-left: 1px solid #222;
    display: flex;
    flex-direction: column;
  }

  .panel-section {
    padding: 16px;
    border-bottom: 1px solid #1a1a1a;
  }

  .panel-label {
    font-size: 0.55rem;
    letter-spacing: 2px;
    color: var(--dim);
    margin-bottom: 8px;
  }

  .hit-counter {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 4rem;
    color: var(--accent);
    line-height: 1;
  }

  select, button.sub-btn {
    width: 100%;
    background: #222;
    color: var(--text);
    border: 1px solid #444;
    padding: 8px;
    font-size: 0.7rem;
    margin-top: 5px;
    cursor: pointer;
  }

  .status-msg {
    font-size: 0.6rem;
    color: #ff3d00;
    margin-top: 10px;
  }

  input[type=range] { width: 100%; accent-color: var(--accent); }
  .val-display { font-size: 0.65rem; color: var(--accent); text-align: right; }

  footer { padding: 8px 20px; font-size: 0.55rem; color: #333; border-top: 1px solid #1a1a1a; }
</style>
</head>
<body>

<header>
  <div class="logo">Drum<span>Vision</span></div>
  <div id="loadingStatus" style="font-size: 0.6rem; color: #888;">AUDIO: STANDBY</div>
</header>

<div class="main">
  <div class="camera-wrap" id="camWrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="hit-flash" id="hitFlash"></div>
    <div class="no-cam" id="noCam">
      <div id="loadInfo" style="color: #fff; margin-bottom: 15px; font-size: 0.8rem;">snare.mp3 を読み込み中...</div>
      <button class="start-btn" id="startBtn" disabled>WAITING FOR AUDIO...</button>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>

  <div class="side">
    <div class="panel-section">
      <div class="panel-label">CAMERA</div>
      <select id="cameraSelect"></select>
    </div>

    <div class="panel-section">
      <div class="panel-label">SNARE HITS</div>
      <div class="hit-counter" id="hitCount">0</div>
    </div>

    <div class="panel-section">
      <div class="panel-label">MOTION SENSITIVITY</div>
      <input type="range" id="motionThresh" min="5" max="80" value="25">
      <div class="val-display" id="motionVal">25</div>
    </div>

    <div class="panel-section">
      <button class="sub-btn" id="resetAreaBtn">RESET AREA</button>
    </div>
  </div>
</div>

<footer>SOURCE: snare.mp3 | AREA SELECTOR ENABLED</footer>

<script>
let videoEl, overlayCanvas, ctx;
let offCanvas, offCtx;
let currentStream = null;
let prevFrame = null;
let hitCount = 0;
let lastHitTime = 0;
let audioCtx = null;
let snareBuffer = null; // スネアの音源データ
let motionThreshold = 25;

// エリア選択
let selection = { x: 0.3, y: 0.3, w: 0.4, h: 0.4 };
let isDragging = false;
let startPos = { x: 0, y: 0 };

// --- Audio Loading ---
async function loadSnareSound() {
  const statusLabel = document.getElementById('loadingStatus');
  const startBtn = document.getElementById('startBtn');
  const loadInfo = document.getElementById('loadInfo');

  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // 同ディレクトリの snare.mp3 を取得
    const response = await fetch('snare.mp3');
    if (!response.ok) throw new Error('snare.mp3が見つかりません');
    
    const arrayBuffer = await response.arrayBuffer();
    snareBuffer = await audioCtx.decodeAudioData(arrayBuffer);
    
    statusLabel.textContent = 'AUDIO: READY';
    statusLabel.style.color = '#00e5ff';
    startBtn.disabled = false;
    startBtn.textContent = 'START SYSTEM';
    loadInfo.textContent = '音源の読み込みが完了しました';
  } catch (err) {
    console.error(err);
    document.getElementById('statusMsg').textContent = 'エラー: ' + err.message;
    loadInfo.textContent = 'snare.mp3 を配置してサーバーから実行してください';
  }
}

function playSnare() {
  if (!audioCtx || !snareBuffer) return;
  
  // バッファソースを作成（再生のたびに作成する必要がある）
  const source = audioCtx.createBufferSource();
  source.buffer = snareBuffer;
  source.connect(audioCtx.destination);
  source.start(0);
}

// --- Vision Logic ---
async function startCamera(id = null) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  
  const constraints = { 
    video: id ? { deviceId: id } : { facingMode: 'user' },
    width: 640, height: 480 
  };
  
  try {
    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
    videoEl.srcObject = currentStream;
    document.getElementById('noCam').style.display = 'none';
    requestAnimationFrame(loop);
  } catch (err) {
    alert("カメラが起動できませんでした。");
  }
}

function loop(ts) {
  if (videoEl.readyState >= 2) {
    if (!offCanvas) {
      offCanvas = document.createElement('canvas');
      offCanvas.width = 160; offCanvas.height = 120;
      offCtx = offCanvas.getContext('2d');
    }
    
    offCtx.drawImage(videoEl, 0, 0, offCanvas.width, offCanvas.height);
    const curr = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);

    if (prevFrame) {
      const motion = checkMotion(curr, prevFrame);
      // 感度とクールダウン(150ms)
      if (motion > motionThreshold && (ts - lastHitTime) > 150) {
        hitCount++;
        document.getElementById('hitCount').textContent = hitCount;
        playSnare();
        const flash = document.getElementById('hitFlash');
        flash.classList.add('show');
        setTimeout(() => flash.classList.remove('show'), 50);
        lastHitTime = ts;
      }
    }
    prevFrame = curr;
    drawOverlay();
  }
  requestAnimationFrame(loop);
}

function checkMotion(curr, prev) {
  const d1 = curr.data;
  const d2 = prev.data;
  let diffCount = 0;

  const x1 = Math.floor(selection.x * offCanvas.width);
  const y1 = Math.floor(selection.y * offCanvas.height);
  const x2 = Math.floor((selection.x + selection.w) * offCanvas.width);
  const y2 = Math.floor((selection.y + selection.h) * offCanvas.height);

  for (let y = y1; y < y2; y++) {
    for (let x = x1; x < x2; x++) {
      const i = (y * offCanvas.width + x) * 4;
      // 輝度変化で判定
      const brightnessDiff = Math.abs(d1[i] - d2[i]);
      if (brightnessDiff > 45) diffCount++;
    }
  }
  return (diffCount / ((x2-x1)*(y2-y1))) * 1000;
}

function drawOverlay() {
  ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  ctx.strokeStyle = isDragging ? '#ffcc00' : '#00e5ff';
  ctx.lineWidth = 3;
  ctx.strokeRect(
    selection.x * overlayCanvas.width,
    selection.y * overlayCanvas.height,
    selection.w * overlayCanvas.width,
    selection.h * overlayCanvas.height
  );
}

// エリア選択イベント
function handleStart(e) {
  const rect = overlayCanvas.getBoundingClientRect();
  const x = (e.clientX || e.touches[0].clientX) - rect.left;
  const y = (e.clientY || e.touches[0].clientY) - rect.top;
  isDragging = true;
  startPos = { x: x / rect.width, y: y / rect.height };
}

function handleMove(e) {
  if (!isDragging) return;
  const rect = overlayCanvas.getBoundingClientRect();
  const x = ((e.clientX || (e.touches && e.touches[0].clientX)) - rect.left) / rect.width;
  const y = ((e.clientY || (e.touches && e.touches[0].clientY)) - rect.top) / rect.height;
  selection.x = Math.max(0, Math.min(startPos.x, x));
  selection.y = Math.max(0, Math.min(startPos.y, y));
  selection.w = Math.min(1.0 - selection.x, Math.abs(x - startPos.x));
  selection.h = Math.min(1.0 - selection.y, Math.abs(y - startPos.y));
}

function handleEnd() { isDragging = false; }

window.onload = () => {
  videoEl = document.getElementById('video');
  overlayCanvas = document.getElementById('overlay');
  ctx = overlayCanvas.getContext('2d');

  // 音源読み込み開始
  loadSnareSound();

  document.getElementById('startBtn').onclick = () => startCamera();
  document.getElementById('resetAreaBtn').onclick = () => {
    selection = { x: 0.3, y: 0.3, w: 0.4, h: 0.4 };
  };
  document.getElementById('motionThresh').oninput = (e) => {
    motionThreshold = e.target.value;
    document.getElementById('motionVal').textContent = motionThreshold;
  };

  overlayCanvas.addEventListener('mousedown', handleStart);
  window.addEventListener('mousemove', handleMove);
  window.addEventListener('mouseup', handleEnd);
  overlayCanvas.addEventListener('touchstart', handleStart);
  window.addEventListener('touchmove', handleMove);
  window.addEventListener('touchend', handleEnd);

  window.onresize = () => {
    overlayCanvas.width = videoEl.clientWidth;
    overlayCanvas.height = videoEl.clientHeight;
  };
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DrumVision Pro - High Strict & Filled</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #000;
    --surface: rgba(25, 25, 25, 0.96);
    --accent: #00ff88; /* LOCKED */
    --pre-lock: #ffcc00; /* DETECTING */
    --searching: #ff3d00;
    --text: #f0f0f0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: 'Space Mono', monospace; 
    height: 100dvh; 
    overflow: hidden; 
    touch-action: none; 
  }

  .main-viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    z-index: 1;
  }

  video, canvas#overlay {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 2;
  }

  /* ドロワー（最前面に配置） */
  .side-drawer {
    position: fixed;
    top: 0;
    right: 0;
    width: 300px;
    height: 100%;
    background: var(--surface);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-left: 1px solid rgba(255,255,255,0.1);
    z-index: 9999;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
    padding: 30px 20px;
    box-shadow: -10px 0 30px rgba(0,0,0,0.6);
  }

  .side-drawer.open { transform: translateX(0); }

  /* ⚙️トグルボタン */
  .drawer-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 50px;
    height: 50px;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    cursor: pointer;
    z-index: 10000;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }

  .header-mini { margin-bottom: 20px; }
  .logo-mini { font-family: 'Bebas Neue'; font-size: 1.8rem; color: var(--accent); }
  .hit-counter { font-family: 'Bebas Neue'; font-size: 6rem; color: var(--accent); text-align: center; margin: 10px 0; }
  .panel-section { margin-bottom: 20px; }
  .panel-label { font-size: 0.65rem; color: #888; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px;}
  
  select, input[type=range] { width: 100%; background: #222; color: #fff; border: 1px solid #444; padding: 12px; font-family: inherit; font-size: 0.8rem; }

  .status-tag { display: inline-block; padding: 4px 10px; font-size: 0.65rem; border-radius: 3px; font-weight: bold; text-transform: uppercase; }
  .status-tag.active { color: var(--accent); border: 1px solid var(--accent); background: rgba(0,255,136,0.1); }
  .status-tag.pre-lock { color: var(--pre-lock); border: 1px solid var(--pre-lock); background: rgba(255,204,0,0.1); }
  .status-tag.error { color: var(--searching); border: 1px solid var(--searching); background: rgba(255,61,0,0.1); }

  #targetAlert {
    position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
    border: 2px solid var(--accent); color: var(--accent); padding: 15px 40px; 
    font-weight: bold; font-size: 1.6rem; z-index: 100; display: none; background: rgba(0,0,0,0.8);
    border-radius: 4px; box-shadow: 0 0 30px rgba(0,255,136,0.5);
  }

  .hit-flash { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 50; }
  .hit-flash.show { opacity: 0.3; }

  .no-cam { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20000; background: #000; }
  .start-btn { background: var(--accent); border: none; padding: 20px 50px; font-family: 'Bebas Neue'; font-size: 2rem; cursor: pointer; border-radius: 5px;}
</style>
</head>
<body>

<div class="main-viewport" id="viewport">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="targetAlert">OCTAGON LOCKED</div>
  <div class="hit-flash" id="hitFlash"></div>

  <div class="drawer-toggle" id="drawerBtn" title="Settings">⚙️</div>

  <aside class="side-drawer" id="drawer">
    <div class="header-mini">
      <div class="logo-mini">DRUMVISION PRO</div>
      <div class="status-tag" id="detectStatus">OFFLINE</div>
    </div>

    <div class="panel-section">
      <div class="panel-label">CAMERA (SELECT & FRONTVIEW)</div>
      <select id="cameraSelect"></select>
    </div>

    <div class="panel-section">
      <div class="panel-label">STRIKE COUNT</div>
      <div class="hit-counter" id="hitCount">0</div>
    </div>

    <div class="panel-section">
      <div class="panel-label">MOTION SENSITIVITY</div>
      <input type="range" id="motionThresh" min="10" max="100" value="45">
      <div style="text-align: right; color:var(--accent); font-size:0.9rem; margin-top:5px; font-weight:bold;" id="motionVal">45</div>
    </div>

    <div style="margin-top:auto; font-size:0.6rem; color:#666; line-height: 1.5; background:rgba(0,0,0,0.3); padding:10px; border-radius:3px;">
      <p class="panel-label" style="color:#aaa;">LOCATE CONDITIONS</p>
      <p>● <strong>COLOR:</strong> STRICT MONO-GRAY (ADAPTIVE)</p>
      <p>● <strong>SHAPE:</strong> 8-GON PAD (CENTER VIEW)</p>
      <p>● <strong>VISUAL:</strong> GREEN FILL = LOCKED</p>
    </div>
  </aside>

  <div class="no-cam" id="noCam">
    <button class="start-btn" id="startBtn">ACTIVATE CORE</button>
  </div>
</div>

<script>
// --- Variables ---
let videoEl, overlayCanvas, ctx, offCanvas, offCtx;
let snareBuffer, audioCtx, currentStream;
let padRect = null, isPadLocked = false, padDetectedFrames = 0;
let prevFrame, motionHistory = [0, 0, 0], hitCount = 0, lastHitTime = 0, motionThreshold = 45;

// 解析解像度を少し上げる (高精度化のため)
const ANALYZE_W = 200, ANALYZE_H = 150;

// --- Drawer Logic ---
const drawer = document.getElementById('drawer');
const drawerBtn = document.getElementById('drawerBtn');
let touchStartX = 0;

drawerBtn.onclick = (e) => { e.stopPropagation(); drawer.classList.toggle('open'); };

window.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
window.addEventListener('touchend', e => {
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (diff > 80 && touchStartX > window.innerWidth * 0.7) drawer.classList.add('open'); // 左開
  if (diff < -80 && drawer.classList.contains('open')) drawer.classList.remove('open'); // 右閉
});

// --- Audio ---
async function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  try {
    const res = await fetch('snare.mp3');
    const data = await res.arrayBuffer();
    snareBuffer = await audioCtx.decodeAudioData(data);
  } catch(e) { console.warn("Audio Load Fail: snare.mp3 required."); }
}

function playSnare() {
  if (!snareBuffer || !audioCtx || !isPadLocked) return;
  const s = audioCtx.createBufferSource(); s.buffer = snareBuffer; s.connect(audioCtx.destination); s.start(0);
}

// --- Camera ---
async function changeCamera(id) {
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  // フロントカメラを選択 & 16:9 
  const c = { video: { deviceId: id ? { exact: id } : undefined, width: 1280, height: 720, facingMode: 'user' } };
  try {
    currentStream = await navigator.mediaDevices.getUserMedia(c);
    videoEl.srcObject = currentStream;
    const devices = await navigator.mediaDevices.enumerateDevices();
    const select = document.getElementById('cameraSelect');
    select.innerHTML = '';
    devices.filter(d => d.kind === 'videoinput').forEach(d => {
      const o = document.createElement('option'); o.value = d.deviceId; o.text = d.label || 'Camera';
      if(d.deviceId === id) o.selected = true;
      select.appendChild(o);
    });
    videoEl.onloadedmetadata = () => {
      overlayCanvas.width = videoEl.clientWidth; overlayCanvas.height = videoEl.clientHeight; ctx = overlayCanvas.getContext('2d');
      requestAnimationFrame(loop);
    };
  } catch(e) { console.error("Camera denied."); }
}

// --- Vision Logic: HIGH STRICT GRAY PAD DETECTOR ---
function findStrictPad(imageData) {
  const { data, width, height } = imageData;
  let minX = width, minY = height, maxX = 0, maxY = 0, count = 0;

  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2];
    const br = (r + g + b) / 3; // 明るさ
    const sat = Math.max(r, g, b) - Math.min(r, g, b); // 彩度（に近いもの）
    
    // 【精度大幅向上】色判定条件の超厳格化
    // 1. Brightness: 暗すぎず明るすぎない (写真はグレー) -> 範囲を狭める
    const isGrayBr = br > 30 && br < 105;
    
    // 2. Saturation: 無彩色である (モノクロ) -> 許容誤差をほぼなくす
    const isGrayMono = sat < 12; // 以前は20

    if (isGrayBr && isGrayMono) {
      const x = (i/4)%width, y = Math.floor((i/4)/width);
      if(x < minX) minX = x; if(x > maxX) maxX = x;
      if(y < minY) minY = y; if(y > maxY) maxY = y;
      count++;
    }
  }

  // 面積・アスペクト比判定も追加（ノイズ除去）
  const rectW = maxX - minX, rectH = maxY - minY;
  const isLargeEnough = count > (width * height * 0.05); // 画面の5%以上
  const isRectShape = rectW > width * 0.15 && rectH > height * 0.15 && rectW / rectH > 0.6 && rectW / rectH < 1.6;

  if (isLargeEnough && isRectShape) {
    const target = { x: minX/width, y: minY/height, w: rectW/width, h: rectH/height };
    if (!padRect) padRect = target;
    else {
      const lerp = 0.25; // 追従を少し早く
      padRect.x += (target.x - padRect.x) * lerp; padRect.y += (target.y - padRect.y) * lerp;
      padRect.w += (target.w - padRect.w) * lerp; padRect.h += (target.h - padRect.h) * lerp;
    }
    return true; 
  }
  return false;
}

function loop(ts) {
  if (videoEl.readyState >= 2) {
    if (!offCanvas) { offCanvas = document.createElement('canvas'); offCanvas.width = ANALYZE_W; offCanvas.height = ANALYZE_H; offCtx = offCanvas.getContext('2d'); }
    offCtx.drawImage(videoEl, 0, 0, offCanvas.width, offCanvas.height);
    const frame = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);

    const found = findStrictPad(frame);
    if (found) {
      padDetectedFrames++;
      // 30フレーム連続検出でロック
      if (padDetectedFrames > 30 && !isPadLocked) { isPadLocked = true; showAlert(); }
    } else {
      padDetectedFrames = 0; isPadLocked = false;
    }

    const status = document.getElementById('detectStatus');
    if (isPadLocked) { status.textContent = "LOCKED"; status.className = "status-tag active"; }
    else if (found) { status.textContent = `SCANNING (${Math.round(padDetectedFrames/30*100)}%)`; status.className = "status-tag pre-lock"; }
    else { status.textContent = "SEARCHING"; status.className = "status-tag error"; }

    if (prevFrame && isPadLocked) {
      const motion = analyzeMotion(frame, prevFrame);
      motionHistory.push(motion); motionHistory.shift();
      if (motionHistory[1] > motionThreshold && motionHistory[1] > motionHistory[2] && motionHistory[1] > motionHistory[0]) {
        if (ts - lastHitTime > 110) {
          hitCount++; document.getElementById('hitCount').textContent = hitCount;
          playSnare();
          const f = document.getElementById('hitFlash'); f.classList.add('show'); setTimeout(() => f.classList.remove('show'), 40);
          lastHitTime = ts;
        }
      }
    }
    prevFrame = frame;
    drawOverlay();
  }
  requestAnimationFrame(loop);
}

function analyzeMotion(curr, prev) {
  const d1 = curr.data, d2 = prev.data;
  const w = offCanvas.width, h = offCanvas.height;
  // 解析キャンバス座標に変換
  const x1 = Math.floor(padRect.x * w), y1 = Math.floor(padRect.y * h);
  const x2 = Math.floor((padRect.x + padRect.w) * w), y2 = Math.floor((padRect.y + padRect.h) * h);
  let diffSum = 0, pixels = 0;
  // 枠内をスキャン
  for (let y = y1; y < y2; y += 2) {
    for (let x = x1; x < x2; x += 2) {
      const i = (y * w + x) * 4;
      if(i < 0 || i >= d1.length) continue;
      // 単純な差分ではなく、輝度変化を見る (スティックは速い)
      const d = Math.abs((d1[i]+d1[i+1]+d1[i+2]) - (d2[i]+d2[i+1]+d2[i+2])) / 3;
      if (d > 35) diffSum += d;
      pixels++;
    }
  }
  return pixels > 0 ? (diffSum / pixels) * 12 : 0;
}

function drawOverlay() {
  ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  if (padRect) {
    const rx = padRect.x * overlayCanvas.width;
    const ry = padRect.y * overlayCanvas.height;
    const rw = padRect.w * overlayCanvas.width;
    const rh = padRect.h * overlayCanvas.height;

    // 【色付け実装】認識領域内を塗りつぶし
    if (isPadLocked) {
      // 1. 緑色の半透明で塗りつぶし
      ctx.fillStyle = 'rgba(0, 255, 136, 0.15)'; // 15%不透明度
      ctx.fillRect(rx, ry, rw, rh);
      
      // 2. 枠線 (太く)
      ctx.strokeStyle = varColor('--accent'); ctx.lineWidth = 5; ctx.setLineDash([]);
    } else {
      ctx.strokeStyle = varColor('--pre-lock'); ctx.lineWidth = 2; ctx.setLineDash([8, 4]);
    }
    ctx.strokeRect(rx, ry, rw, rh);
    
    // LOCKED時の演出
    if (isPadLocked) {
      ctx.fillStyle = varColor('--accent'); ctx.font = 'bold 12px Space Mono';
      ctx.fillText("TARGET: Locked (Fill = READY)", rx, ry - 10);
    }
  }
}

function showAlert() { const a = document.getElementById('targetAlert'); a.style.display = 'block'; setTimeout(()=>a.style.display='none', 1600); }
function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

window.onload = () => {
  videoEl = document.getElementById('video'); overlayCanvas = document.getElementById('overlay');
  document.getElementById('startBtn').onclick = async () => { await initAudio(); document.getElementById('noCam').style.display = 'none'; await changeCamera(); };
  document.getElementById('cameraSelect').onchange = e => changeCamera(e.target.value);
  document.getElementById('motionThresh').oninput = e => { motionThreshold = parseInt(e.target.value); document.getElementById('motionVal').textContent = e.target.value; };
  window.onresize = () => { if(videoEl.readyState >= 2) { overlayCanvas.width = videoEl.clientWidth; overlayCanvas.height = videoEl.clientHeight; ctx = overlayCanvas.getContext('2d'); } };
};
</script>
</body>
</html>
